[tool.poetry]
name = "sentinel-ai"
version = "0.1.0"
description = "Sentinel AI - Autonomous AI incident resolution platform"
authors = ["Sentinel Team <team@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
pydantic = "^2.7.4"
pydantic-settings = "^2.3.4"
sqlalchemy = "^2.0.30"
psycopg2-binary = "^2.9.9"
pgvector = "^0.3.0"
alembic = "^1.13.1"
redis = "^5.0.7"
google-generativeai = "^0.7.1"
langgraph = "^0.0.69"
PyGithub = "^2.3.0"
[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
httpx = "^0.27.0"
ruff = ">=0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
